apiVersion: v1
kind: PersistentVolume
metadata:
  name: song-service-pv
spec:
  storageClassName: manual
  capacity:
    storage: 256Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/song-service/test-data/
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: song-service-pvc
  namespace: k8s-program-bohdan
spec:
  storageClassName: manual
  volumeName: song-service-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
