apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: k8s-program-bohdan
spec:
  type: NodePort
  selector:
    app: resource-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: song-service
  namespace: k8s-program-bohdan
spec:
  type: NodePort
  selector:
    app: song-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: resource-db
  namespace: k8s-program-bohdan
spec:
  type: ClusterIP
  selector:
    app: resource-db
  ports:
    - port: 5433
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: song-db
  namespace: k8s-program-bohdan
spec:
  type: ClusterIP
  selector:
    app: song-db
  ports:
    - port: 5432
      targetPort: 5432
